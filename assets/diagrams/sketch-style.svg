<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 0 0" style="display:none">
  <!-- Shared sketch filter for hand-drawn diagrams -->
  <defs>
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#1e1e1e"/>
    </marker>
  </defs>
</svg>
